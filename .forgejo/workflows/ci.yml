name: CI

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: codeberg-tiny

    steps:
      - name: Checkout
        uses: https://codeberg.org/actions/checkout@v4

      - name: Setup Node
        uses: https://codeberg.org/actions/setup-node@v4
        with:
         node-version: 22

      - name: Install deps
        run: npm ci
